# SEC-04: this repository's own caller of security_scan.yaml.
# Self-referencing rather than @main, so a change to the reusable workflow is
# exercised by this repository's own pull requests before the fleet's callers
# (which use @main) pick it up. Same pattern as opteryx.app's fides scan.
name: Security Scan

on:
  push:
  pull_request:
  schedule:
    # Minute is sha256("mabel-dev/.github") mod 60, so the fleet does not all start at once.
    - cron: '27 5 * * *'

permissions: {}

jobs:
  security-scan:
    permissions:
      contents: read
      id-token: write  # OIDC to authenticate.opteryx for the upload; no stored secret
    uses: ./.github/workflows/security_scan.yaml
    with:
      # No Python here; this also exercises the Bandit-skipped path.
      python: false
